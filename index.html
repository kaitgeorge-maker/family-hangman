<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Hangman</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --bg: #f4f7f6;
      --card: #ffffff;
      --accent: #ff6b6b;
      --easy: #2ecc71;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 2.2rem;
    }
    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 15px 0;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .score-item {
      background: #eef2f5;
      padding: 8px 16px;
      border-radius: 20px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    select, button {
      padding: 8px 14px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      cursor: pointer;
      transition: all 0.2s;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
      transform: none;
    }
    .btn-easy { background-color: var(--easy); }
    .btn-accent { background-color: #f39c12; }
    .btn-modal { background-color: #9b59b6; }
    
    #svg-container {
      width: 220px;
      height: 220px;
      margin: 0 auto;
    }
    .word-display {
      font-size: 2.5rem;
      letter-spacing: 12px;
      margin: 20px 0;
      font-weight: bold;
      min-height: 50px;
    }
    .hint-box {
      font-style: italic;
      color: #666;
      margin-bottom: 15px;
      min-height: 24px;
    }
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 600px;
      margin: 0 auto;
    }
    .key {
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 0;
      border-radius: 6px;
    }
    .key.used {
      background-color: #e0e0e0;
      color: #a0a0a0;
    }
    .status-message {
      font-size: 1.3rem;
      font-weight: bold;
      margin: 15px 0;
      min-height: 30px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .modal input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Family Hangman</h1>

    <div class="scoreboard">
      <div class="score-item">Wins: <span id="wins">0</span></div>
      <div class="score-item">Streak: <span id="streak">0</span></div>
      <div class="score-item">Best: <span id="best">0</span></div>
    </div>

    <div class="controls">
      <select id="category-select" onchange="resetGame()">
        <option value="Animals">Animals</option>
        <option value="Space">Space</option>
        <option value="Food">Food</option>
        <option value="Adventure">Adventure</option>
      </select>

      <select id="mode-select" onchange="resetGame()">
        <option value="Normal">Normal Mode (6 Misses)</option>
        <option value="Easy">Easy Mode (8 Misses)</option>
      </select>

      <button id="btn-free-letter" class="btn-accent" onclick="useFreeLetter()">Free Letter</button>
      <button id="btn-hint" onclick="showHint()">Show Hint</button>
      <button class="btn-modal" onclick="openCustomModal()">Pass & Play</button>
    </div>

    <div id="svg-container">
      <svg width="220" height="220" viewBox="0 0 200 200">
        <!-- Gallows -->
        <line x1="20" y1="190" x2="100" y2="190" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>
        <line x1="40" y1="190" x2="40" y2="20" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>
        <line x1="37" y1="20" x2="120" y2="20" stroke="#5d4037" stroke-width="6" stroke-linecap="round"/>
        <line x1="120" y1="20" x2="120" y2="40" stroke="#d7ccc8" stroke-width="4"/>

        <!-- Hangman Parts -->
        <!-- Part 1: Head & Propeller Hat -->
        <g id="part-head" style="display:none;">
          <circle cx="120" cy="55" r="15" fill="#ffe0bd" stroke="#333" stroke-width="2"/>
          <circle cx="115" cy="52" r="2" fill="#333"/>
          <circle cx="125" cy="52" r="2" fill="#333"/>
          <path d="M 115 60 Q 120 65 125 60" fill="none" stroke="#333" stroke-width="1.5"/>
          <path d="M 105 45 Q 120 40 135 45 L 135 47 L 105 47 Z" fill="#e74c3c"/>
          <line x1="120" y1="42" x2="120" y2="35" stroke="#333" stroke-width="2"/>
          <ellipse cx="113" cy="35" rx="7" ry="2" fill="#f1c40f"/>
          <ellipse cx="127" cy="35" rx="7" ry="2" fill="#f1c40f"/>
        </g>

        <!-- Part 2: Body -->
        <line id="part-body" x1="120" y1="70" x2="120" y2="120" stroke="#3498db" stroke-width="5" stroke-linecap="round" style="display:none;"/>

        <!-- Part 3: Left Arm -->
        <line id="part-arm-left" x1="120" y1="80" x2="95" y2="100" stroke="#3498db" stroke-width="4" stroke-linecap="round" style="display:none;"/>

        <!-- Part 4: Right Arm -->
        <line id="part-arm-right" x1="120" y1="80" x2="145" y2="100" stroke="#3498db" stroke-width="4" stroke-linecap="round" style="display:none;"/>

        <!-- Part 5: Left Leg + Clown Shoe -->
        <g id="part-leg-left" style="display:none;">
          <line x1="120" y1="120" x2="105" y2="155" stroke="#333" stroke-width="4" stroke-linecap="round"/>
          <path d="M 108 155 C 90 155 85 168 108 168 C 112 168 112 155 108 155 Z" fill="#e74c3c" stroke="#333" stroke-width="1.5"/>
        </g>

        <!-- Part 6: Right Leg + Clown Shoe -->
        <g id="part-leg-right" style="display:none;">
          <line x1="120" y1="120" x2="135" y2="155" stroke="#333" stroke-width="4" stroke-linecap="round"/>
          <path d="M 132 155 C 150 155 155 168 132 168 C 128 168 128 155 132 155 Z" fill="#e74c3c" stroke="#333" stroke-width="1.5"/>
        </g>

        <!-- Extra Parts for Easy Mode -->
        <circle id="part-extra-1" cx="120" cy="95" r="3" fill="#e74c3c" style="display:none;"/>
        <path id="part-extra-2" d="M 112 63 Q 120 58 128 63" fill="none" stroke="#e74c3c" stroke-width="2" style="display:none;"/>
      </svg>
    </div>

    <div id="word-display" class="word-display">_ _ _ _ _</div>
    <div id="hint-box" class="hint-box"></div>
    <div id="status-message" class="status-message"></div>

    <div id="keyboard" class="keyboard"></div>
  </div>

  <!-- Custom Word Modal -->
  <div id="custom-modal" class="modal">
    <div class="modal-content">
      <h3>Pass & Play Custom Word</h3>
      <input type="text" id="custom-word-input" placeholder="Enter custom word..." maxlength="20">
      <input type="text" id="custom-hint-input" placeholder="Enter hint (optional)..." maxlength="50">
      <div id="modal-msg" style="color:red; margin: 5px 0; font-size: 0.9rem;"></div>
      <div style="margin-top: 15px; display: flex; justify-content: space-around;">
        <button onclick="submitCustomWord()">Start Game</button>
        <button onclick="closeCustomModal()" style="background:#7f8c8d;">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const WORD_BANK = {
      Animals: [
        { word: "ELEPHANT", hint: "Large mammal with a trunk" },
        { word: "GIRAFFE", hint: "Tallest terrestrial animal" },
        { word: "KANGAROO", hint: "Australian marsupial that hops" },
        { word: "DOLPHIN", hint: "Intelligent marine mammal" },
        { word: "PENGUIN", hint: "Flightless bird in tuxedos" },
        { word: "CHEETAH", hint: "Fastest land animal" },
        { word: "ZEBRA", hint: "Black and white striped horse relative" }
      ],
      Space: [
        { word: "ASTRONAUT", hint: "Space traveler" },
        { word: "GALAXY", hint: "Vast system of stars" },
        { word: "PLANET", hint: "Celestial body orbiting a star" },
        { word: "TELESCOPE", hint: "Instrument for observing distant objects" },
        { word: "METEOR", hint: "Space rock entering Earth's atmosphere" },
        { word: "SUPERNOVA", hint: "Powerful exploding star" },
        { word: "SATELLITE", hint: "Orbits a planet for communication or research" }
      ],
      Food: [
        { word: "SPAGHETTI", hint: "Long thin Italian pasta" },
        { word: "PIZZA", hint: "Cheesy baked pie with toppings" },
        { word: "HAMBURGER", hint: "Patty inside a sliced bun" },
        { word: "ICECREAM", hint: "Sweet frozen dessert" },
        { word: "PANCAKES", hint: "Flat breakfast cake topped with syrup" },
        { word: "TACOS", hint: "Mexican dish in folded tortilla" },
        { word: "WATERMELON", hint: "Large juicy red fruit with green rind" }
      ],
      Adventure: [
        { word: "TREASURE", hint: "Hidden gold or valuable items" },
        { word: "MOUNTAIN", hint: "Large natural elevation of Earth's surface" },
        { word: "BACKPACK", hint: "Bag carried on the back for hiking" },
        { word: "COMPASS", hint: "Navigation tool pointing North" },
        { word: "EXPLORER", hint: "Person who travels to discover new places" },
        { word: "SAFARI", hint: "Expedition to observe wildlife" },
        { word: "WILDERNESS", hint: "Uncultivated, uninhabited region" }
      ]
    };

    let currentWordObj = { word: "", hint: "" };
    let guessedLetters = new Set();
    let wrongGuesses = 0;
    let maxWrong = 6;
    let gameOver = false;
    let freeLetterUsed = false;

    let wins = 0;
    let streak = 0;
    let bestStreak = 0;

    const partIds = [
      "part-head",
      "part-body",
      "part-arm-left",
      "part-arm-right",
      "part-leg-left",
      "part-leg-right",
      "part-extra-1",
      "part-extra-2"
    ];

    function initKeyboard() {
      const keyboardEl = document.getElementById("keyboard");
      keyboardEl.innerHTML = "";
      for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        const btn = document.createElement("button");
        btn.textContent = letter;
        btn.className = "key";
        btn.id = "key-" + letter;
        btn.onclick = () => handleGuess(letter);
        keyboardEl.appendChild(btn);
      }
    }

    function updateScoreboard() {
      document.getElementById("wins").textContent = wins;
      document.getElementById("streak").textContent = streak;
      document.getElementById("best").textContent = bestStreak;
    }

    function resetGame(customWordObj = null) {
      gameOver = false;
      guessedLetters.clear();
      wrongGuesses = 0;
      freeLetterUsed = false;

      const mode = document.getElementById("mode-select").value;
      maxWrong = mode === "Easy" ? 8 : 6;

      document.getElementById("btn-free-letter").disabled = false;
      document.getElementById("hint-box").textContent = "";
      document.getElementById("status-message").textContent = "";
      document.getElementById("status-message").style.color = "#333";

      partIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = "none";
      });

      if (customWordObj) {
        currentWordObj = customWordObj;
      } else {
        const category = document.getElementById("category-select").value;
        const list = WORD_BANK[category];
        currentWordObj = list[Math.floor(Math.random() * list.length)];
      }

      initKeyboard();
      renderWord();
    }

    function renderWord() {
      const displayArr = currentWordObj.word.split("").map(letter => {
        if (guessedLetters.has(letter) || gameOver) {
          return letter;
        }
        return "_";
      });
      document.getElementById("word-display").textContent = displayArr.join(" ");

      if (!gameOver) {
        const isWon = currentWordObj.word.split("").every(l => guessedLetters.has(l));
        if (isWon) {
          handleWin();
        }
      }
    }

    function handleGuess(letter) {
      if (gameOver || guessedLetters.has(letter)) return;

      guessedLetters.add(letter);
      const btn = document.getElementById("key-" + letter);
      if (btn) btn.disabled = true;

      if (!currentWordObj.word.includes(letter)) {
        wrongGuesses++;
        if (wrongGuesses <= partIds.length) {
          const el = document.getElementById(partIds[wrongGuesses - 1]);
          if (el) el.style.display = "block";
        }
        if (wrongGuesses >= maxWrong) {
          handleLoss();
        }
      }

      renderWord();
    }

    function useFreeLetter() {
      if (gameOver || freeLetterUsed) return;

      const unguessed = currentWordObj.word.split("").filter(l => !guessedLetters.has(l));
      if (unguessed.length > 0) {
        const randomLetter = unguessed[Math.floor(Math.random() * unguessed.length)];
        freeLetterUsed = true;
        document.getElementById("btn-free-letter").disabled = true;
        handleGuess(randomLetter);
      }
    }

    function showHint() {
      document.getElementById("hint-box").textContent = "Hint: " + (currentWordObj.hint || "No hint available");
    }

    function handleWin() {
      gameOver = true;
      wins++;
      streak++;
      if (streak > bestStreak) bestStreak = streak;
      updateScoreboard();

      document.getElementById("status-message").textContent = "🎉 You Won! Excellent Job!";
      document.getElementById("status-message").style.color = "#2ecc71";

      if (typeof confetti === "function") {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }

      renderWord();
      setTimeout(() => resetGame(), 4000);
    }

    function handleLoss() {
      gameOver = true;
      streak = 0;
      updateScoreboard();

      document.getElementById("status-message").textContent = `💥 Game Over! The word was: ${currentWordObj.word}`;
      document.getElementById("status-message").style.color = "#e74c3c";

      renderWord();
      setTimeout(() => resetGame(), 4000);
    }

    function openCustomModal() {
      document.getElementById("custom-modal").style.display = "flex";
      document.getElementById("custom-word-input").value = "";
      document.getElementById("custom-hint-input").value = "";
      document.getElementById("modal-msg").textContent = "";
    }

    function closeCustomModal() {
      document.getElementById("custom-modal").style.display = "none";
    }

    async function submitCustomWord() {
      const rawWord = document.getElementById("custom-word-input").value.trim().toUpperCase();
      const hint = document.getElementById("custom-hint-input").value.trim();
      const msgEl = document.getElementById("modal-msg");

      if (!rawWord || !/^[A-Z]+$/.test(rawWord)) {
        msgEl.textContent = "Please enter a valid word (A-Z letters only).";
        return;
      }

      msgEl.textContent = "Checking spell with Datamuse API...";

      try {
        const response = await fetch(`https://api.datamuse.com/words?sp=${rawWord.toLowerCase()}&max=1`);
        const data = await response.json();

        if (data && data.length > 0 && data[0].word.toUpperCase() === rawWord) {
          closeCustomModal();
          resetGame({ word: rawWord, hint: hint || "Custom Pass & Play word" });
        } else {
          msgEl.textContent = "Word selected!";
          setTimeout(() => {
            closeCustomModal();
            resetGame({ word: rawWord, hint: hint || "Custom Pass & Play word" });
          }, 500);
        }
      } catch (e) {
        closeCustomModal();
        resetGame({ word: rawWord, hint: hint || "Custom Pass & Play word" });
      }
    }

    window.onload = () => {
      resetGame();
    };
  </script>
</body>
</html>
