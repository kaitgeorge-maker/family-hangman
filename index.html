<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Family Hangman</title><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script><style>:root { --bg-color: #f4f7fe; --card-bg: #ffffff; --primary: #4361ee; --primary-hover: #3f37c9; --accent: #ff007f; --text: #2b2d42; --light-bg: #eef2f7; } * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } body { background: var(--bg-color); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; } header { text-align: center; margin-bottom: 15px; } h1 { font-size: 2rem; color: var(--primary); margin-bottom: 5px; } .scoreboard { display: flex; gap: 15px; background: var(--card-bg); padding: 10px 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; font-weight: bold; } .score-item { text-align: center; } .score-val { color: var(--accent); font-size: 1.2rem; } .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 600px; width: 100%; margin-bottom: 15px; } select, button, input { padding: 8px 14px; border-radius: 8px; border: 1px solid #ccc; font-weight: 600; font-size: 0.9rem; cursor: pointer; outline: none; } button { background: var(--primary); color: white; border: none; transition: 0.2s; } button:hover { background: var(--primary-hover); } button:disabled { background: #b0b7c6; cursor: not-allowed; } .btn-accent { background: #7209b7; } .btn-accent:hover { background: #560bad; } .btn-action { background: #4cc9f0; color: #000; } .game-container { display: flex; flex-direction: column; align-items: center; background: var(--card-bg); border-radius: 16px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); } #character-svg { width: 180px; height: 180px; background: #eef2f7; border-radius: 12px; margin-bottom: 15px; } .word-display { display: flex; gap: 8px; font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; min-height: 45px; } .letter-box { width: 32px; height: 42px; border-bottom: 3px solid var(--primary); display: flex; align-items: center; justify-content: center; text-transform: uppercase; } .hint-box { font-size: 0.95rem; color: #555; font-style: italic; margin-bottom: 15px; text-align: center; min-height: 24px; } .keyboard { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 450px; margin-top: 10px; } .key { width: 36px; height: 42px; display: flex; align-items: center; justify-content: center; font-weight: bold; background: var(--light-bg); border-radius: 6px; border: 1px solid #d0d7de; } .key.used { background: #d0d7de; color: #888; cursor: not-allowed; } .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; } .modal-content { background: white; padding: 25px; border-radius: 16px; max-width: 400px; width: 90%; text-align: center; } .modal-content input { width: 80%; margin: 15px 0; padding: 10px; font-size: 1rem; } .status-msg { font-size: 0.85rem; margin-top: -5px; margin-bottom: 10px; }</style></head><body><header><h1>Family Hangman 🎈</h1></header><div class="scoreboard"><div class="score-item">Wins: <span id="wins-val" class="score-val">0</span></div><div class="score-item">Streak: <span id="streak-val" class="score-val">0</span></div><div class="score-item">Best: <span id="best-val" class="score-val">0</span></div></div><div class="controls"><select id="category-select" onchange="changeCategory()"><option value="Animals">🐾 Animals</option><option value="Space">🚀 Space</option><option value="Food">🍕 Food</option><option value="Adventure">🗺️ Adventure</option></select><select id="mode-select" onchange="changeMode()"><option value="Normal">Normal Mode (6 Mistakes)</option><option value="Easy">Easy Mode (8 Mistakes)</option></select><button class="btn-accent" onclick="openPassPlayModal()">🤝 Pass & Play</button><button class="btn-action" id="free-letter-btn" onclick="useFreeLetter()">🎁 Free Letter</button><button class="btn-action" id="show-hint-btn" onclick="useShowHint()">💡 Show Hint</button><button onclick="resetGame()">🔄 New Game</button></div><div class="game-container"><svg id="character-svg" viewBox="0 0 200 220"><path d="M 20 200 L 80 200 M 40 200 L 40 20 L 120 20 L 120 40" stroke="#8b5a2b" stroke-width="6" fill="none" stroke-linecap="round"/><line x1="120" y1="40" x2="120" y2="55" stroke="#d4a373" stroke-width="3" id="rope" style="display:none;"/><g id="part-head" style="display:none;"><circle cx="120" cy="75" r="20" fill="#ffdbac" stroke="#333" stroke-width="2"/><circle cx="113" cy="72" r="3" fill="#333"/><circle cx="127" cy="72" r="3" fill="#333"/><path d="M 112 80 Q 120 88 128 80" stroke="#333" stroke-width="2" fill="none"/><path d="M 100 62 Q 120 52 140 62 Z" fill="#ff4757" stroke="#333" stroke-width="1.5"/><line x1="120" y1="56" x2="120" y2="48" stroke="#333" stroke-width="2"/><ellipse cx="112" cy="48" rx="8" ry="3" fill="#2ed573"/><ellipse cx="128" cy="48" rx="8" ry="3" fill="#ffa502"/><circle cx="120" cy="48" r="2.5" fill="#333"/></g><g id="part-torso" style="display:none;"><rect x="108" y="95" width="24" height="40" rx="5" fill="#1e90ff" stroke="#333" stroke-width="2"/><circle cx="120" cy="105" r="2" fill="#fff"/><circle cx="120" cy="120" r="2" fill="#fff"/></g><g id="part-left-arm" style="display:none;"><line x1="108" y1="102" x2="88" y2="122" stroke="#1e90ff" stroke-width="5" stroke-linecap="round"/><circle cx="86" cy="124" r="4" fill="#ffdbac"/></g><g id="part-right-arm" style="display:none;"><line x1="132" y1="102" x2="152" y2="122" stroke="#1e90ff" stroke-width="5" stroke-linecap="round"/><circle cx="154" cy="124" r="4" fill="#ffdbac"/></g><g id="part-left-leg" style="display:none;"><line x1="114" y1="135" x2="114" y2="165" stroke="#333" stroke-width="4"/><path d="M 114 165 C 100 165 90 172 90 180 C 90 188 118 188 118 180 Z" fill="#ff1100" stroke="#333" stroke-width="2"/><circle cx="100" cy="172" r="3" fill="#fff"/></g><g id="part-right-leg" style="display:none;"><line x1="126" y1="135" x2="126" y2="165" stroke="#333" stroke-width="4"/><path d="M 126 165 C 140 165 150 172 150 180 C 150 188 122 188 122 180 Z" fill="#ff1100" stroke="#333" stroke-width="2"/><circle cx="140" cy="172" r="3" fill="#fff"/></g><g id="part-extra-1" style="display:none;"><polygon points="120,95 112,90 112,100" fill="#ffa502" stroke="#333"/><polygon points="120,95 128,90 128,100" fill="#ffa502" stroke="#333"/><circle cx="120" cy="95" r="2" fill="#ff4757"/></g><g id="part-extra-2" style="display:none;"><circle cx="108" cy="77" r="3" fill="#ff6b81" opacity="0.8"/><circle cx="132" cy="77" r="3" fill="#ff6b81" opacity="0.8"/></g></svg><div class="hint-box" id="hint-display">Category: <span id="cat-name">Animals</span></div><div class="word-display" id="word-display"></div><div class="keyboard" id="keyboard"></div></div><div class="modal" id="pass-play-modal"><div class="modal-content"><h3>Pass & Play Custom Word</h3><p style="font-size:0.9rem; color:#666; margin-top:5px;">Enter a custom word. We'll check spelling via Datamuse API!</p><input type="password" id="custom-word-input" placeholder="Enter word..." autocomplete="off"><div class="status-msg" id="custom-status"></div><div style="display:flex; gap:10px; justify-content:center;"><button onclick="submitCustomWord()">Start Game</button><button style="background:#888;" onclick="closePassPlayModal()">Cancel</button></div></div></div><script>const WORD_LISTS = { Animals: [{ word: "ELEPHANT", hint: "Large mammal with a trunk" }, { word: "DOLPHIN", hint: "Smart marine animal" }, { word: "PENGUIN", hint: "Flightless bird in tuxedos" }, { word: "GIRAFFE", hint: "Tallest living terrestrial animal" }, { word: "KANGAROO", hint: "Australian pouched hopper" }, { word: "CHEETAH", hint: "Fastest land animal" }], Space: [{ word: "ASTRONAUT", hint: "Person who travels in space" }, { word: "GALAXY", hint: "Massive system of stars" }, { word: "TELESCOPE", hint: "Instrument to view distant stars" }, { word: "PLANET", hint: "Celestial body orbiting a star" }, { word: "COMET", hint: "Icy body with a tail" }, { word: "SUPERNOVA", hint: "Exploding star" }], Food: [{ word: "SPAGHETTI", hint: "Long Italian pasta" }, { word: "PANCAKE", hint: "Flat breakfast cake" }, { word: "CHOCOLATE", hint: "Sweet treat from cocoa" }, { word: "PINEAPPLE", hint: "Tropical spiky fruit" }, { word: "AVOCADO", hint: "Green fruit used for guacamole" }, { word: "HAMBURGER", hint: "Grilled patty in a bun" }], Adventure: [{ word: "TREASURE", hint: "Valuable hidden riches" }, { word: "COMPASS", hint: "Tool for finding direction" }, { word: "MOUNTAIN", hint: "Large natural elevation of land" }, { word: "EXPEDITION", hint: "Journey with a purpose" }, { word: "SAFARI", hint: "Overland journey to view wildlife" }, { word: "BACKPACK", hint: "Bag worn on the back" }] }; let currentCategory = "Animals", currentMode = "Normal", targetWord = "", targetHint = "", guessedLetters = new Set(), wrongGuesses = 0, wins = 0, streak = 0, best = 0, freeLetterUsed = false, hintShown = false; function initKeyboard() { const kb = document.getElementById('keyboard'); kb.innerHTML = ''; for (let i = 65; i <= 90; i++) { const char = String.fromCharCode(i), btn = document.createElement('button'); btn.className = 'key'; btn.innerText = char; btn.id = 'key-' + char; btn.onclick = () => handleGuess(char); kb.appendChild(btn); } } function getPartsForMode() { return currentMode === 'Normal' ? ['part-head', 'part-torso', 'part-left-arm', 'part-right-arm', 'part-left-leg', 'part-right-leg'] : ['part-head', 'part-extra-1', 'part-torso', 'part-left-arm', 'part-right-arm', 'part-extra-2', 'part-left-leg', 'part-right-leg']; } function resetGame(customWord = null, customHint = null) { guessedLetters.clear(); wrongGuesses = 0; freeLetterUsed = false; hintShown = false; document.getElementById('free-letter-btn').disabled = false; document.getElementById('show-hint-btn').disabled = false; ['part-head', 'part-torso', 'part-left-arm', 'part-right-arm', 'part-left-leg', 'part-right-leg', 'part-extra-1', 'part-extra-2', 'rope'].forEach(id => { document.getElementById(id).style.display = 'none'; }); if (customWord) { targetWord = customWord.toUpperCase(); targetHint = customHint || "Custom Word (Pass & Play)"; document.getElementById('cat-name').innerText = "Pass & Play"; } else { const list = WORD_LISTS[currentCategory], item = list[Math.floor(Math.random() * list.length)]; targetWord = item.word.toUpperCase(); targetHint = item.hint; document.getElementById('cat-name').innerText = currentCategory; } document.getElementById('hint-display').innerHTML = `Category: <b>${document.getElementById('cat-name').innerText}</b>`; renderWord(); initKeyboard(); } function renderWord() { const display = document.getElementById('word-display'); display.innerHTML = ''; let isWin = true; for (let char of targetWord) { const box = document.createElement('div'); box.className = 'letter-box'; if (guessedLetters.has(char)) { box.innerText = char; } else { box.innerText = ''; isWin = false; } display.appendChild(box); } if (isWin && targetWord.length > 0) { handleWin(); } } function handleGuess(char) { if (guessedLetters.has(char)) return; guessedLetters.add(char); const btn = document.getElementById('key-' + char); if (btn) btn.classList.add('used'); if (!targetWord.includes(char)) { wrongGuesses++; updateCharacter(); } renderWord(); } function updateCharacter() { const parts = getPartsForMode(); document.getElementById('rope').style.display = 'block'; for (let i = 0; i < wrongGuesses && i < parts.length; i++) { document.getElementById(parts[i]).style.display = 'block'; } if (wrongGuesses >= parts.length) { handleLoss(); } } function handleWin() { wins++; streak++; if (streak > best) best = streak; updateScoreboard(); if (typeof confetti === 'function') { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); } setTimeout(() => { alert(`🎉 You won! The word was "${targetWord}"!`); resetGame(); }, 300); } function handleLoss() { streak = 0; updateScoreboard(); setTimeout(() => { alert(`💔 Game Over! The word was "${targetWord}".`); resetGame(); }, 300); } function updateScoreboard() { document.getElementById('wins-val').innerText = wins; document.getElementById('streak-val').innerText = streak; document.getElementById('best-val').innerText = best; } function changeCategory() { currentCategory = document.getElementById('category-select').value; resetGame(); } function changeMode() { currentMode = document.getElementById('mode-select').value; resetGame(); } function useFreeLetter() { if (freeLetterUsed) return; const remaining = []; for (let char of targetWord) { if (!guessedLetters.has(char)) remaining.push(char); } if (remaining.length > 0) { const randomChar = remaining[Math.floor(Math.random() * remaining.length)]; freeLetterUsed = true; document.getElementById('free-letter-btn').disabled = true; handleGuess(randomChar); } } function useShowHint() { if (hintShown) return; hintShown = true; document.getElementById('show-hint-btn').disabled = true; document.getElementById('hint-display').innerHTML = `Category: <b>${document.getElementById('cat-name').innerText}</b> — <i>Hint: ${targetHint}</i>`; } function openPassPlayModal() { document.getElementById('pass-play-modal').style.display = 'flex'; document.getElementById('custom-word-input').value = ''; document.getElementById('custom-status').innerText = ''; } function closePassPlayModal() { document.getElementById('pass-play-modal').style.display = 'none'; } async function submitCustomWord() { const val = document.getElementById('custom-word-input').value.trim().toUpperCase(), status = document.getElementById('custom-status'); if (!val || !/^[A-Z]+$/.test(val)) { status.style.color = 'red'; status.innerText = 'Please enter a single word (letters only).'; return; } status.style.color = '#333'; status.innerText = 'Checking word with Datamuse...'; try { const res = await fetch(`https://api.datamuse.com/words?sp=${val.toLowerCase()}&max=1`), data = await res.json(); if (data && data.length > 0 && data[0].word.toUpperCase() === val) { closePassPlayModal(); resetGame(val, 'Custom Pass & Play Word'); } else { status.style.color = 'red'; status.innerText = 'Word not found in Datamuse dictionary. Try another!'; } } catch (e) { closePassPlayModal(); resetGame(val, 'Custom Pass & Play Word'); } } resetGame();</script></body></html>
